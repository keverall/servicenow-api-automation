name: Deploy OpsRamp gateway

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose scoped secrets should be used
        required: true
        default: prod
        type: choice
        options: [dev, staging, prod]
      profile_name:
        description: OpsRamp management profile to create or reuse
        required: false
        type: string
      package:
        description: Gateway package to deploy
        required: false
        default: ova
        type: choice
        options: [ova, iso, windows, google, nextgen_iso, nextgen_ova]
      provisioner:
        description: How the appliance is made reachable
        required: false
        default: existing
        type: choice
        options: [existing, vsphere]
      dry_run:
        description: Report what would change without changing anything
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "gateway-v*"

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-gateway-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and register the gateway
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'prod' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install
        run: uv sync --frozen

      - name: Gateway CA certificate
        if: ${{ env.GATEWAY_CA_BUNDLE != '' }}
        env:
          GATEWAY_CA_BUNDLE: ${{ secrets.GATEWAY_CA_BUNDLE }}
        run: |
          mkdir -p .opsramp-certs
          printf '%s' "$GATEWAY_CA_BUNDLE" | base64 -d > .opsramp-certs/gateway-ca.pem
          echo "GATEWAY_CA_BUNDLE=.opsramp-certs/gateway-ca.pem" >> "$GITHUB_ENV"

      - name: Deploy the gateway
        env:
          OPSRAMP_BASE_URL: ${{ secrets.OPSRAMP_BASE_URL }}
          OPSRAMP_TENANT_ID: ${{ secrets.OPSRAMP_TENANT_ID }}
          OPSRAMP_CLIENT_ID: ${{ secrets.OPSRAMP_CLIENT_ID }}
          OPSRAMP_CLIENT_SECRET: ${{ secrets.OPSRAMP_CLIENT_SECRET }}
          GATEWAY_HOST: ${{ secrets.GATEWAY_HOST }}
          GATEWAY_PORT: ${{ secrets.GATEWAY_PORT }}
          GATEWAY_USERNAME: ${{ secrets.GATEWAY_USERNAME }}
          GATEWAY_PASSWORD: ${{ secrets.GATEWAY_PASSWORD }}
          GATEWAY_VERIFY_TLS: ${{ secrets.GATEWAY_VERIFY_TLS }}
          GATEWAY_REGISTRATION_SERVER: ${{ secrets.GATEWAY_REGISTRATION_SERVER }}
          DEPLOY_PROFILE_NAME: ${{ inputs.profile_name || vars.DEPLOY_PROFILE_NAME }}
          DEPLOY_PACKAGE_NAME: ${{ inputs.package || 'ova' }}
          DEPLOY_PROVISIONER: ${{ inputs.provisioner || 'existing' }}
          DEPLOY_HOSTNAME: ${{ vars.DEPLOY_HOSTNAME }}
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
          DEPLOY_INTERFACE: ${{ vars.DEPLOY_INTERFACE }}
          DEPLOY_IP_ADDRESS: ${{ vars.DEPLOY_IP_ADDRESS }}
          DEPLOY_SUBNET: ${{ vars.DEPLOY_SUBNET }}
          DEPLOY_NETWORK_GATEWAY: ${{ vars.DEPLOY_NETWORK_GATEWAY }}
          DEPLOY_DNS: ${{ vars.DEPLOY_DNS }}
          DEPLOY_DHCP: ${{ vars.DEPLOY_DHCP }}
          DEPLOY_TIMEZONE: ${{ vars.DEPLOY_TIMEZONE }}
          DEPLOY_NTP_SERVERS: ${{ vars.DEPLOY_NTP_SERVERS }}
          DEPLOY_SYSLOG_RECEIVERS: ${{ vars.DEPLOY_SYSLOG_RECEIVERS }}
          DEPLOY_PROXY_CONNECTION: ${{ vars.DEPLOY_PROXY_CONNECTION }}
          DEPLOY_PROXY_IP: ${{ vars.DEPLOY_PROXY_IP }}
          DEPLOY_PROXY_PORT: ${{ vars.DEPLOY_PROXY_PORT }}
          DEPLOY_PROXY_USER: ${{ secrets.DEPLOY_PROXY_USER }}
          DEPLOY_PROXY_PASSWORD: ${{ secrets.DEPLOY_PROXY_PASSWORD }}
          VSHERE_HOST: ${{ secrets.VSHERE_HOST }}
          VSHERE_USER: ${{ secrets.VSHERE_USER }}
          VSHERE_PASSWORD: ${{ secrets.VSHERE_PASSWORD }}
          VSHERE_DATACENTER: ${{ vars.VSHERE_DATACENTER }}
          VSHERE_DATASTORE: ${{ vars.VSHERE_DATASTORE }}
          VSHERE_NETWORK: ${{ vars.VSHERE_NETWORK }}
          VSHERE_CLUSTER: ${{ vars.VSHERE_CLUSTER }}
        run: |
          set -o pipefail
          uv run opsramp-gw deploy \
            ${{ inputs.profile_name && format('--profile-name {0}', inputs.profile_name) || '' }} \
            --package "${{ inputs.package || 'ova' }}" \
            --provisioner "${{ inputs.provisioner || 'existing' }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            --report deploy-report.json \
            | tee deploy-output.txt

      - name: Publish the report
        if: always()
        run: |
          {
            echo "### OpsRamp gateway deployment"
            echo
            echo '```'
            cat deploy-output.txt 2>/dev/null || echo "no output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the deploy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-report
          path: |
            deploy-report.json
            deploy-output.txt
          if-no-files-found: ignore

      - name: Verify the appliance
        if: ${{ !inputs.dry_run }}
        env:
          GATEWAY_HOST: ${{ secrets.GATEWAY_HOST }}
          GATEWAY_PORT: ${{ secrets.GATEWAY_PORT }}
          GATEWAY_USERNAME: ${{ secrets.GATEWAY_USERNAME }}
          GATEWAY_PASSWORD: ${{ secrets.GATEWAY_PASSWORD }}
          GATEWAY_CA_BUNDLE: ${{ env.GATEWAY_CA_BUNDLE }}
        run: |
          uv run opsramp-gw admin status
          uv run opsramp-gw admin config --info generalInfo
