[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opsramp-automation"
version = "0.1.0"
description = "HPE OpsRamp Gateway CI/CD, appliance administration and ServiceNow event integration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kev Everall" }]
keywords = ["opsramp", "servicenow", "gateway", "automation", "cicd"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: System Administrators",
]
dependencies = [
    "httpx[http2]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "PyYAML>=6.0",
    "structlog>=24.1",
    "tenacity>=8.2",
]

[project.optional-dependencies]
webhook = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.30",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML>=6.0",
    # The webhook receiver is part of the typed source tree, so the type
    # checker needs its imports to be present.
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
opsramp-gw = "opsramp_automation.cli:app"

[project.urls]
Homepage = "https://github.com/keverall/servicenow-api-automation"
Repository = "https://github.com/keverall/servicenow-api-automation"

[tool.uv]
# The default `dev` dependency group is installed by `uv sync`.
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/opsramp_automation"]

[tool.hatch.build.targets.sdist]
include = ["src", "config", "tests", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
    "ANN",
    "S",
    "ASYNC",
    "PTH",
    "BLE",
]
ignore = [
    "ANN401",  # Any is acceptable in a handful of JSON passthrough signatures
    "S101",    # asserts are used in tests
    "B008",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# The OpsRamp and ServiceNow models mirror the wire format exactly, so the
# field names are camelCase by design.
"src/opsramp_automation/opsramp/models.py" = ["N815"]
"src/opsramp_automation/servicenow/models.py" = ["N815"]
"src/opsramp_automation/webhook/receiver.py" = ["N815"]
# The gateway admin client mirrors the vendor's camelCase action payloads.
"src/opsramp_automation/opsramp/gateway_admin.py" = ["N803"]
"tests/**" = ["ANN", "S105", "S106", "S311", "PTH"]
"src/opsramp_automation/cli.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["opsramp_automation"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = false
disallow_untyped_defs = true
disallow_untyped_calls = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
plugins = []

[[tool.mypy.overrides]]
module = ["yaml", "respx.*", "pytest_httpx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that would require live API access (deselected by default)",
]
filterwarnings = ["error::DeprecationWarning:opsramp_automation.*"]
